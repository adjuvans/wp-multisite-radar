name: Deploy to WordPress.org

# Publication manuelle dans le SVN de WordPress.org (écart E7 du plan M7) : jamais sur un push de tag.
# Simulation par défaut ; secrets SVN_USERNAME et SVN_PASSWORD ; procédure dans docs/release.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z, not a pre-release)
        required: true
        type: string
      dry_run:
        description: Simulate only (nothing is committed to the SVN)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: wordpress.org
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a release tag (vX.Y.Z, no pre-release)."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run readme:check
      - name: Check that the tag is the version of the plugin
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -sSfL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version
      # Même paquet que celui soumis : version, build, traductions compilées (bin/i18n.sh) et contrôle du contenu.
      - name: Build the package (make dist)
        run: make dist
      - uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: ${{ inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: multisite-radar
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: ${{ github.workspace }}/dist/multisite-radar
          ASSETS_DIR: .wordpress-org
