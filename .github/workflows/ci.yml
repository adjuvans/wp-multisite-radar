name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
        wp: ['6.9', '7.1', 'trunk']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2, wp-cli
      - name: Download WordPress ${{ matrix.wp }}
        run: |
          if [ "${{ matrix.wp }}" = "trunk" ]; then VERSION=nightly; else VERSION="${{ matrix.wp }}"; fi
          wp core download --path="$WP_CORE_DIR" --version="$VERSION" --force
      - name: Install dependencies matching WordPress ${{ matrix.wp }}
        run: |
          if [ "${{ matrix.wp }}" = "trunk" ]; then TESTS="dev-master"; else TESTS="${{ matrix.wp }}.*"; fi
          composer require --dev --no-update "wp-phpunit/wp-phpunit:$TESTS"
          composer update --no-progress --prefer-dist -W
      - run: vendor/bin/phpunit

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_DB_NAME: wordpress_e2e
      E2E_DB_USER: root
      E2E_DB_PASSWORD: root
      E2E_DB_HOST: 127.0.0.1:3306
      E2E_WP_VERSION: '7.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -sSfL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version
      - name: Acceptance test (spec 1.4 criterion 1)
        run: bin/e2e.sh

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run readme:check
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run test:unit
      - run: npm run build

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the distributable directory
        run: |
          mkdir -p /tmp/build/multisite-radar
          rsync -a --exclude-from=.distignore ./ /tmp/build/multisite-radar/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: /tmp/build/multisite-radar
          # Tout avertissement fait échouer le job (écart E3 du plan M7). Une nouvelle version majeure de WordPress
          # peut faire signaler « Tested up to » : mettre le readme à jour (docs/release.md).
          strict: true

  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run wp-env -- start
      - run: npm run e2e:setup
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts
          retention-days: 7
